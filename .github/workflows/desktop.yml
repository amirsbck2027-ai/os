name: Build desktop apps
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, args: --win,   name: windows }
          - { os: macos-latest,   args: --mac,   name: macos }
          - { os: ubuntu-latest,  args: --linux, name: linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install (web build tools + desktop)
        run: npm install --no-audit --no-fund && cd desktop && npm install --no-audit --no-fund
      - name: Unit tests (Wi-Fi, battery and system parsers)
        working-directory: desktop
        run: npm test
      - name: Build
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # unsigned builds; add signing secrets to sign
        run: npm run sync && npx electron-builder ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: aura-os-${{ matrix.name }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.AppImage
            desktop/dist/*.deb
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.AppImage
            desktop/dist/*.deb
