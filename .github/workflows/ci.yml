name: CI
on:
  push:
  pull_request:
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund && npm i --no-save playwright && npx playwright install --with-deps chromium
      - name: Build (minified)
        run: npm run build
      - name: End-to-end tests against the minified build
        run: |
          (cd dist && python3 -m http.server 8765 &) 
          sleep 1
          mkdir -p shots
          node tests/e2e.js http://localhost:8765/index.html shots
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screenshots, path: shots }
  desktop-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd desktop && npm test
