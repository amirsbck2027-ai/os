name: FORGE OS — ISO from source archive

on:
  push:
    branches: [forge-os-linux-build]
    paths:
      - 'forge-os-source.zip'
      - '.github/workflows/forge-from-archive.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Unpack FORGE OS source
        run: |
          mkdir -p forge-os
          unzip -q forge-os-source.zip -d forge-os
          test -x forge-os/scripts/build.sh
      - name: Validate source
        run: cd forge-os && ./scripts/verify.sh
      - name: Build installable ISO on Debian
        run: |
          docker run --rm --privileged \
            -v "$PWD/forge-os:/project" \
            -w /project \
            debian:trixie \
            sh -ec 'apt-get update; DEBIAN_FRONTEND=noninteractive apt-get install -y live-build debootstrap xorriso squashfs-tools ca-certificates python3; ./scripts/build.sh'
      - name: Verify ISO
        run: |
          cd forge-os/build
          test -s live-image-amd64.hybrid.iso
          sha256sum -c live-image-amd64.hybrid.iso.sha256
      - name: Inspect boot image and bundled desktop
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso squashfs-tools
          xorriso -osirrox on -indev forge-os/build/live-image-amd64.hybrid.iso \
            -extract /live/filesystem.squashfs /tmp/forge-filesystem.squashfs
          unsquashfs -ll /tmp/forge-filesystem.squashfs usr/local/bin/forge-control | grep 'forge-control'
          unsquashfs -ll /tmp/forge-filesystem.squashfs usr/bin/calamares | grep 'calamares'
          unsquashfs -ll /tmp/forge-filesystem.squashfs usr/bin/xfce4-session | grep 'xfce4-session'
          unsquashfs -ll /tmp/forge-filesystem.squashfs usr/bin/unattended-upgrade | grep 'unattended-upgrade'
          unsquashfs -ll /tmp/forge-filesystem.squashfs etc/xdg/autostart/forge-session.desktop | grep 'forge-session.desktop'
          unsquashfs -ll /tmp/forge-filesystem.squashfs etc/skel/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-panel.xml | grep 'xfce4-panel.xml'
      - name: Split large ISO
        run: |
          mkdir -p output
          cp forge-os/build/live-image-amd64.hybrid.iso.sha256 output/
          split -b 512M -d -a 3 forge-os/build/live-image-amd64.hybrid.iso output/FORGE-OS.iso.part-
      - name: Publish build artifact
        uses: actions/upload-artifact@v4
        with:
          name: forge-os-installer-iso-parts
          path: output/*
          retention-days: 14
          if-no-files-found: error
