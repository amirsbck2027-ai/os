<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aura OS</title>
<style>
:root{
  --accent:#0a84ff;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;
  --glass:rgba(246,246,248,.72);
  --glass-strong:rgba(250,250,252,.88);
  --text:#1d1d1f; --text2:#6e6e73; --line:rgba(0,0,0,.1);
  --win:#fff; --side:rgba(236,236,240,.8); --hover:rgba(0,0,0,.06); --field:#fff;
  --shadow:0 22px 60px rgba(0,0,0,.35),0 0 0 .5px rgba(0,0,0,.25);
}
:root.dark{
  --glass:rgba(40,40,44,.7); --glass-strong:rgba(44,44,48,.9);
  --text:#f5f5f7; --text2:#98989f; --line:rgba(255,255,255,.12);
  --win:#1e1e20; --side:rgba(40,40,44,.85); --hover:rgba(255,255,255,.08); --field:#2c2c2e;
  --shadow:0 22px 60px rgba(0,0,0,.6),0 0 0 .5px rgba(255,255,255,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:var(--font);font-size:13px;color:var(--text);user-select:none;-webkit-user-select:none}
button,input,select,textarea{font:inherit;color:inherit}
svg{display:block}
#os{position:fixed;inset:0;overflow:hidden}
#wallpaper{position:absolute;inset:0;background-size:cover;transition:background 1s}
#bright{position:fixed;inset:0;background:#000;pointer-events:none;z-index:99999;opacity:0}
/* boot / lock / off */
#boot,#off{position:fixed;inset:0;background:#000;z-index:9000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:42px;transition:opacity .6s}
#off{z-index:9500;color:#666;cursor:pointer}
#boot .logo,#lock .logo{width:84px;height:84px}
.bar{width:190px;height:5px;border-radius:3px;background:#333;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#fff;border-radius:3px;transition:width 1.7s cubic-bezier(.4,.1,.3,1)}
#lock{position:fixed;inset:0;z-index:8000;display:none;flex-direction:column;align-items:center;color:#fff;transition:opacity .5s,transform .5s,filter .5s}
#lock .lbg{position:absolute;inset:0;filter:blur(18px) brightness(.8);transform:scale(1.1);background-size:cover}
#lock>*:not(.lbg){position:relative}
#lock .date{margin-top:9vh;font-size:22px;font-weight:500;opacity:.9}
#lock .time{font-size:104px;font-weight:700;letter-spacing:-2px;line-height:1.05}
#lock .who{margin-top:auto;margin-bottom:11vh;display:flex;flex-direction:column;align-items:center;gap:12px}
.avatar{width:78px;height:78px;border-radius:50%;background:linear-gradient(160deg,#8e9aaf,#5b6577);display:grid;place-items:center;font-size:34px;font-weight:600;border:1px solid rgba(255,255,255,.35)}
#lock input{background:rgba(255,255,255,.22);border:0;border-radius:16px;padding:8px 16px;color:#fff;text-align:center;outline:none;width:200px;backdrop-filter:blur(20px)}
#lock input::placeholder{color:rgba(255,255,255,.7)}
#lock .hint{font-size:12px;opacity:.75}
#lock .err{color:#ffb4ae;font-size:12px;height:14px}
/* menubar */
#menubar{position:absolute;top:0;left:0;right:0;height:26px;background:var(--glass);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);display:flex;align-items:center;justify-content:space-between;padding:0 8px;z-index:50000;font-size:13px;box-shadow:0 .5px 0 var(--line)}
#menubar .l,#menubar .r{display:flex;align-items:center;height:100%}
.mb{padding:0 9px;height:22px;border-radius:5px;display:flex;align-items:center;gap:6px;cursor:default;white-space:nowrap}
.mb:hover,.mb.open{background:var(--hover)}
.mb.bold{font-weight:700}
.mb svg{fill:var(--text)}
.dd{position:fixed;min-width:210px;background:var(--glass-strong);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border-radius:9px;padding:5px;box-shadow:0 10px 40px rgba(0,0,0,.35),0 0 0 .5px var(--line);z-index:60000;font-size:13px}
.dd .it{display:flex;justify-content:space-between;gap:24px;padding:3px 10px;border-radius:5px;cursor:default;white-space:nowrap}
.dd .it:hover:not(.dis){background:var(--accent);color:#fff}
.dd .it.dis{opacity:.4}
.dd .it .k{opacity:.6}
.dd .sep{height:1px;background:var(--line);margin:5px 8px}
/* desktop icons */
#icons{position:absolute;top:34px;right:10px;bottom:100px;display:flex;flex-direction:column;flex-wrap:wrap-reverse;align-content:flex-start;gap:6px}
.ficon{width:84px;padding:5px 2px;border-radius:7px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:default}
.ficon .lbl{font-size:12px;line-height:1.2;word-break:break-word;max-width:80px;padding:1px 4px;border-radius:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#icons .ficon{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.ficon.sel .lbl{background:var(--accent);color:#fff;text-shadow:none}
#icons .ficon.sel{background:rgba(255,255,255,.2)}
.ficon.dragover{outline:2px solid var(--accent)}
.ficon svg,.ficon img{width:54px;height:54px;object-fit:cover;border-radius:6px}
/* windows */
#windows{position:absolute;inset:0;pointer-events:none}
.window{position:absolute;pointer-events:auto;background:var(--win);border-radius:11px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;min-width:260px;min-height:140px;transition:opacity .22s,transform .25s cubic-bezier(.3,.7,.3,1);animation:pop .22s cubic-bezier(.2,.9,.3,1.1)}
@keyframes pop{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:none}}
.window.inactive{box-shadow:0 12px 36px rgba(0,0,0,.25),0 0 0 .5px var(--line)}
.window.minimized{opacity:0;pointer-events:none;transform:scale(.1) translateY(300px)}
.window.closing{opacity:0;transform:scale(.9)}
.window.max{border-radius:0}
.window.anim{transition:all .25s cubic-bezier(.3,.7,.3,1)}
.titlebar{height:38px;flex:none;display:flex;align-items:center;padding:0 12px;gap:8px;position:relative;background:var(--glass-strong);box-shadow:0 .5px 0 var(--line);cursor:default}
.window.inactive .titlebar{opacity:.85}
.traffic{display:flex;gap:8px;z-index:2}
.traffic i{width:12px;height:12px;border-radius:50%;display:block;position:relative;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2)}
.traffic i:nth-child(1){background:#ff5f57}.traffic i:nth-child(2){background:#febc2e}.traffic i:nth-child(3){background:#28c840}
.window.inactive .traffic i{background:#8b8b8f55}
.traffic:hover i::after{content:"";position:absolute;inset:3px;border-radius:50%;background:rgba(0,0,0,.45)}
.titlebar .ttl{position:absolute;left:0;right:0;text-align:center;font-weight:600;font-size:13px;pointer-events:none;padding:0 90px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wbody{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.rz{position:absolute;z-index:5}
.rz[data-d=n]{top:0;left:14px;right:14px;height:5px;cursor:ns-resize}.rz[data-d=s]{bottom:0;left:14px;right:14px;height:6px;cursor:ns-resize}
.rz[data-d=e]{right:0;top:14px;bottom:14px;width:6px;cursor:ew-resize}.rz[data-d=w]{left:0;top:14px;bottom:14px;width:6px;cursor:ew-resize}
.rz[data-d=ne]{top:0;right:0;width:14px;height:14px;cursor:nesw-resize}.rz[data-d=nw]{top:0;left:0;width:14px;height:14px;cursor:nwse-resize}
.rz[data-d=se]{bottom:0;right:0;width:16px;height:16px;cursor:nwse-resize}.rz[data-d=sw]{bottom:0;left:0;width:16px;height:16px;cursor:nesw-resize}
.window.max .rz{display:none}
/* dock */
#dockwrap{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;pointer-events:none;z-index:40000}
#dock{pointer-events:auto;display:flex;align-items:flex-end;gap:6px;padding:6px 8px;background:var(--glass);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border-radius:22px;box-shadow:0 0 0 .5px rgba(255,255,255,.35),0 10px 40px rgba(0,0,0,.3);height:auto}
.di{position:relative;width:var(--s,56px);height:var(--s,56px);display:flex;align-items:center;justify-content:center;cursor:default}
.di .ic{width:100%;height:100%;border-radius:22%;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.di .ic svg{width:100%;height:100%}
.di .tip{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);background:var(--glass-strong);backdrop-filter:blur(20px);padding:3px 11px;border-radius:7px;font-size:13px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s;box-shadow:0 0 0 .5px var(--line)}
.di:hover .tip{opacity:1}
.di .dot{position:absolute;bottom:-5px;width:4px;height:4px;border-radius:50%;background:var(--text);opacity:.85;display:none}
.di.run .dot{display:block}
.di.bounce .ic{animation:bounce .6s ease 2}
@keyframes bounce{50%{transform:translateY(-26px)}}
.dsep{width:1px;align-self:stretch;margin:4px 3px;background:var(--line)}
/* overlays */
.overlay{position:absolute;inset:0;z-index:45000;display:none}
#launchpad{background:rgba(20,20,30,.5);backdrop-filter:blur(40px) saturate(150%);-webkit-backdrop-filter:blur(40px) saturate(150%);flex-direction:column;align-items:center;padding-top:50px;color:#fff}
#launchpad.show{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
#launchpad input{width:230px;padding:5px 12px;border-radius:9px;border:0;background:rgba(255,255,255,.2);color:#fff;outline:none;text-align:center;margin-bottom:46px}
#launchpad input::placeholder{color:rgba(255,255,255,.7)}
#lpgrid{display:grid;grid-template-columns:repeat(auto-fill,130px);gap:34px 20px;width:min(900px,90vw);justify-content:center}
.lpi{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:default;font-size:13px}
.lpi .ic{width:86px;height:86px;border-radius:22%;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.35);transition:transform .15s}
.lpi:hover .ic{transform:scale(1.07)}
.lpi svg{width:100%;height:100%}
#spot{background:rgba(0,0,0,.12);align-items:flex-start;justify-content:center;padding-top:16vh}
#spot.show{display:flex}
.spbox{width:min(640px,92vw);background:var(--glass-strong);backdrop-filter:blur(50px) saturate(180%);-webkit-backdrop-filter:blur(50px) saturate(180%);border-radius:16px;box-shadow:0 20px 70px rgba(0,0,0,.45),0 0 0 .5px var(--line);overflow:hidden}
.spbox input{width:100%;border:0;background:transparent;font-size:24px;padding:14px 20px;outline:none}
.spres{border-top:1px solid var(--line);padding:6px;max-height:340px;overflow:auto}
.spres:empty{display:none}
.sr{display:flex;align-items:center;gap:12px;padding:7px 12px;border-radius:8px;font-size:14px}
.sr.sel{background:var(--accent);color:#fff}
.sr .ic{width:26px;height:26px;border-radius:6px;overflow:hidden;flex:none}.sr .ic svg{width:100%;height:100%}
.sr small{margin-left:auto;opacity:.7}
#cc{position:absolute;top:32px;right:8px;width:310px;background:var(--glass);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border-radius:18px;padding:12px;box-shadow:0 14px 50px rgba(0,0,0,.35),0 0 0 .5px var(--line);z-index:55000;display:none;grid-template-columns:1fr 1fr;gap:10px}
#cc.show{display:grid;animation:fade .15s}
.tile{background:var(--hover);border-radius:14px;padding:11px 12px;display:flex;align-items:center;gap:10px;cursor:default;font-weight:500}
.tile .b{width:32px;height:32px;border-radius:50%;background:rgba(128,128,128,.35);display:grid;place-items:center;flex:none}
.tile.on .b{background:var(--accent);color:#fff}
.tile small{display:block;font-weight:400;color:var(--text2);font-size:11px}
.slide{grid-column:1/3;background:var(--hover);border-radius:14px;padding:9px 12px}
.slide b{font-size:12px;font-weight:600}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;border-radius:11px;background:rgba(128,128,128,.3);outline:none;overflow:hidden;margin:6px 0 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;background:#fff;border-radius:50%;box-shadow:-300px 0 0 290px #fff,0 0 3px rgba(0,0,0,.4)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border:0;background:#fff;border-radius:50%}
#toasts{position:absolute;top:34px;right:10px;display:flex;flex-direction:column;gap:8px;z-index:56000;pointer-events:none}
.toast{width:320px;background:var(--glass-strong);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-radius:16px;padding:10px 14px;box-shadow:0 10px 36px rgba(0,0,0,.3),0 0 0 .5px var(--line);animation:slidein .35s cubic-bezier(.2,.9,.3,1.1);transition:opacity .4s,transform .4s}
.toast b{display:block;font-size:13px}.toast span{color:var(--text2);font-size:12.5px}
.toast.out{opacity:0;transform:translateX(30px)}
@keyframes slidein{from{opacity:0;transform:translateX(60px)}}
#ctx{z-index:70000}
#dlg{position:fixed;inset:0;z-index:80000;background:rgba(0,0,0,.25);display:none;align-items:flex-start;justify-content:center;padding-top:20vh}
#dlg.show{display:flex}
.sheet{width:300px;background:var(--glass-strong);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);border-radius:14px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.45),0 0 0 .5px var(--line);text-align:center;animation:pop .2s}
.sheet h3{margin:0 0 4px;font-size:14px}.sheet p{margin:0 0 12px;color:var(--text2);font-size:12px}
.sheet input{width:100%;padding:5px 8px;border-radius:6px;border:1px solid var(--line);background:var(--field);outline:none;margin-bottom:12px;user-select:text}
.sheet input:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 40%,transparent);border-color:var(--accent)}
.sheet .btns{display:flex;gap:8px}
.btn{flex:1;padding:4px 12px;border-radius:6px;border:1px solid var(--line);background:var(--field);cursor:default;text-align:center}
.btn:active{filter:brightness(.92)}
.btn.pri{background:var(--accent);color:#fff;border-color:transparent}
/* shared app UI */
.toolbar{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--win)}
.tbtn{border:0;background:transparent;border-radius:6px;padding:3px 9px;cursor:default;color:var(--text);min-width:28px;height:26px}
.tbtn:hover:not(:disabled){background:var(--hover)}.tbtn:disabled{opacity:.3}.tbtn.act{background:var(--hover)}
.field{border:1px solid var(--line);background:var(--field);border-radius:6px;padding:3px 9px;outline:none;user-select:text}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.split{display:flex;flex:1;min-height:0}
.sidebar{width:170px;flex:none;background:var(--side);backdrop-filter:blur(20px);padding:10px 8px;overflow:auto;border-right:1px solid var(--line)}
.sidebar h6{margin:10px 8px 4px;font-size:11px;color:var(--text2);font-weight:600}
.sb{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:6px;cursor:default}
.sb.sel{background:var(--hover)}.sb.dragover{outline:2px solid var(--accent)}
.sb svg{width:16px;height:16px;fill:var(--accent);flex:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.fgrid{flex:1;overflow:auto;padding:12px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:4px;outline:none}
.fgrid .ficon{color:var(--text)}
.flist{flex:1;overflow:auto;padding:6px;outline:none}
.flist .row{display:flex;gap:10px;align-items:center;padding:3px 8px;border-radius:6px}
.flist .row:nth-child(even){background:var(--hover)}
.flist .row.sel{background:var(--accent);color:#fff}
.flist .row svg,.flist .row img{width:18px;height:18px}
.flist .row .n{flex:1}.flist .row .m{width:150px;color:inherit;opacity:.6}.flist .row .sz{width:70px;text-align:right;opacity:.6}
.status{padding:4px 12px;border-top:1px solid var(--line);color:var(--text2);font-size:11.5px;text-align:center}
textarea.edit{flex:1;border:0;outline:none;resize:none;background:var(--win);padding:14px 16px;font-size:14px;line-height:1.5;user-select:text;tab-size:4}
.term{flex:1;background:rgba(20,20,22,.92);color:#e8e8e8;font-family:var(--mono);font-size:12.5px;padding:8px 10px;overflow:auto;user-select:text;line-height:1.4;cursor:text}
.term pre{margin:0;white-space:pre-wrap;word-break:break-word;font:inherit}
.term .ln{display:flex;gap:6px}.term .ln input{flex:1;background:transparent;border:0;outline:none;color:inherit;font:inherit;caret-color:#fff}
.term .p{color:#7fdc8d}.term .d{color:#6cb4ff}.term .e{color:#ff8a80}
.calc{background:#1c1c1e;padding:10px;display:flex;flex-direction:column;flex:1;color:#fff}
.calc .scr{flex:1;text-align:right;font-size:52px;font-weight:300;padding:6px 8px;display:flex;align-items:flex-end;justify-content:flex-end;overflow:hidden;white-space:nowrap}
.calc .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.calc button{border:0;border-radius:50px;height:52px;font-size:22px;background:#505052;color:#fff;cursor:default}
.calc button:active{filter:brightness(1.4)}
.calc button.fn{background:#a5a5a7;color:#000}.calc button.op{background:#ff9f0a}.calc button.op.on{background:#fff;color:#ff9f0a}
.calc button.z{grid-column:span 2;text-align:left;padding-left:22px}
.notes-list{width:200px;flex:none;border-right:1px solid var(--line);overflow:auto;background:var(--side)}
.nrow{padding:8px 12px;border-bottom:1px solid var(--line);cursor:default}.nrow.sel{background:#ffd60a;color:#000}.nrow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nrow small{opacity:.65}
.browser-view{flex:1;border:0;background:#fff;width:100%}
.startpage{flex:1;overflow:auto;background:linear-gradient(160deg,#eef2ff,#f5f0ff);color:#222;display:flex;flex-direction:column;align-items:center;padding-top:60px;gap:26px}
:root.dark .startpage{background:linear-gradient(160deg,#16181f,#1c1626);color:#eee}
.favs{display:grid;grid-template-columns:repeat(4,90px);gap:18px}
.fav{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:default;font-size:12px}
.fav i{width:60px;height:60px;border-radius:14px;display:grid;place-items:center;color:#fff;font-style:normal;font-size:26px;font-weight:700;box-shadow:0 3px 10px rgba(0,0,0,.2)}
.sett-h{padding:18px 24px;overflow:auto;flex:1;user-select:text}
.sett-h h2{margin:0 0 14px;font-size:20px}
.card{background:var(--hover);border-radius:11px;padding:4px 14px;margin-bottom:16px}
.crow{display:flex;align-items:center;justify-content:space-between;padding:10px 0;gap:14px}
.crow+.crow{border-top:1px solid var(--line)}
.sw{width:40px;height:24px;border-radius:12px;background:rgba(128,128,128,.4);position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .2s}
.sw.on{background:#34c759}.sw.on::after{transform:translateX(16px)}
.walls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:10px 0}
.wall{height:80px;border-radius:9px;cursor:default;border:3px solid transparent}.wall.sel{border-color:var(--accent)}
.swatches{display:flex;gap:8px}.swatches i{width:22px;height:22px;border-radius:50%;cursor:default;border:2px solid transparent;background-clip:padding-box;box-shadow:0 0 0 1px rgba(0,0,0,.15)}.swatches i.sel{outline:2px solid var(--text);outline-offset:1px}
table.am{width:100%;border-collapse:collapse}table.am th{text-align:left;font-weight:600;color:var(--text2);padding:5px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--win)}table.am td{padding:5px 10px}table.am tr:nth-child(even) td{background:var(--hover)}
canvas{display:block}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:rgba(128,128,128,.4);border-radius:5px;border:2px solid transparent;background-clip:padding-box}
</style>
</head>
<body>
<div id="boot"><svg class="logo" viewBox="0 0 100 100"><defs><linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5ac8fa"/><stop offset="1" stop-color="#af52de"/></linearGradient></defs><circle cx="50" cy="50" r="44" fill="url(#bg1)"/><circle cx="50" cy="50" r="22" fill="none" stroke="#fff" stroke-width="7"/><circle cx="50" cy="50" r="7" fill="#fff"/></svg><div class="bar"><i></i></div></div>
<div id="lock"><div class="lbg"></div><div class="date"></div><div class="time"></div>
